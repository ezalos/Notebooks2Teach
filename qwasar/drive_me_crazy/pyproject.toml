[project]
name = "drive-me-crazy"
version = "0.1.0"
description = "Qwasar DS project: traffic flow forecasting with traditional baselines and a compact PDFormer"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "scipy>=1.16",
    "scikit-learn>=1.7",
    "torch==2.8.0",
    "matplotlib>=3.10",
    "plotly>=6.3",
    "jupyterlab>=4.4",
    "ipykernel>=6.30",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "gdown>=5.2",
    "tqdm>=4.66",
]
